services:
  # ===== SERVICE 1 : l'application Node.js =====
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: module4-app:v1
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=module4db
    volumes:
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - module4-network
    restart: unless-stopped

  # ===== SERVICE 2 : la base PostgreSQL =====
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=module4db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - module4-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

# ===== Les volumes nommés (persistance) =====
volumes:
  postgres-data:
  app-logs:

# ===== Le réseau privé entre les services =====
networks:
  module4-network:
    driver: bridge